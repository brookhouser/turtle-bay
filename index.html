<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <script>
      // GitHub Pages serves 404.html for deep links, which returns here as /turtle-bay/?/route.
      // Restore the real path before the app boots. No effect on a normal visit.
      (function (loc) {
        if (loc.search[1] === '/') {
          var decoded = loc.search
            .slice(1)
            .split('&')
            .map(function (part) {
              return part.replace(/~and~/g, '&')
            })
            .join('?')
          window.history.replaceState(null, '', loc.pathname.slice(0, -1) + decoded + loc.hash)
        }
      })(window.location)
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Turtle Bay is a kids pet game. Care for a turtle and earn coins with typing lessons."
    />
    <meta name="theme-color" content="#8fd0c6" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Turtle Bay" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="%BASE_URL%manifest.json" />
    <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%icons/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Fredoka:wght@400;500;600;700&family=Libre+Bodoni:wght@700&family=Nunito:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>Turtle Bay</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // GitHub Pages only. Dev and the Firebase hosting build use base "/" and skip this,
      // so sign-in and saved bays keep working exactly as they do today.
      ;(function () {
        var base = '%BASE_URL%'
        if (!('serviceWorker' in navigator) || base === '/') return
        navigator.serviceWorker
          .register(base + 'sw.js', { scope: base, updateViaCache: 'none' })
          .catch(function () {})
      })()
    </script>
  </body>
</html>
